name: CI/CD DevSecOps

# Flujo de ramas:
#   feature → test (integración y pruebas) → Pull Request → main (producción)
# En test y en los PR se ejecutan build, pruebas y controles de seguridad.
# Solo un push a main que pase TODAS las etapas dispara el despliegue en Render.
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------- BUILD + TEST
  build-test:
    name: Build y pruebas automatizadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias (API)
        working-directory: backend
        run: npm ci

      - name: Pruebas unitarias y de integración de la API (Jest + Supertest)
        working-directory: backend
        run: npm run test:ci

      - name: Instalar dependencias (web)
        working-directory: frontend
        run: npm ci

      - name: Pruebas unitarias del frontend (Vitest)
        working-directory: frontend
        run: npm run test:ci

      - name: Build de producción del frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Resumen de pruebas y cobertura
        if: always()
        run: |
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const leer = (f) => (fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '');
          const junit = (f) => {
            const x = leer(f);
            const n = (a) => Number((x.match(new RegExp(`<testsuites[^>]*\\s${a}="(\\d+)"`)) || [])[1] || 0);
            return { total: n('tests'), fallos: n('failures') + n('errors') };
          };
          const api = junit('backend/reports/junit.xml');
          const web = junit('frontend/reports/junit.xml');
          console.log('## 🧪 Resultados de pruebas\n');
          console.log('| Suite | Pruebas | Fallidas | Estado |\n|---|---|---|---|');
          for (const [n, r] of [['API (Jest + Supertest)', api], ['Web (Vitest)', web]]) {
            console.log(`| ${n} | ${r.total} | ${r.fallos} | ${r.fallos ? '❌' : '✅'} |`);
          }
          const cov = leer('backend/coverage/coverage-summary.json');
          if (cov) {
            const t = JSON.parse(cov).total;
            console.log('\n## 📊 Cobertura de la API\n');
            console.log('| Métrica | % |\n|---|---|');
            for (const k of ['lines', 'statements', 'functions', 'branches']) console.log(`| ${k} | ${t[k].pct} |`);
          }
          EOF

      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            backend/reports/
            backend/coverage/
            frontend/reports/
          retention-days: 14

  # ---------------------------------------------------------------- SAST
  sast:
    name: SAST – CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  # ---------------------------------------------------------------- SCA
  sca:
    name: SCA – Análisis de dependencias
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit – API (falla con vulnerabilidades altas o críticas)
        working-directory: backend
        run: npm audit --audit-level=high
      - name: npm audit – Web (falla con vulnerabilidades altas o críticas)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Revisión de dependencias nuevas del Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---------------------------------------------------------------- SECRETOS
  secretos:
    name: Escaneo de secretos – Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks sobre todo el historial de Git
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 \
            git /repo --redact --verbose --exit-code 1

  # ---------------------------------------------------------------- CONTENEDOR
  contenedor:
    name: Imagen Docker + Trivy + smoke test
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t sjl-seguro:${{ github.sha }} .
      - name: Trivy – vulnerabilidades HIGH/CRITICAL en la imagen
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            image --severity HIGH,CRITICAL --ignore-unfixed --no-progress --exit-code 1 \
            sjl-seguro:${{ github.sha }}
      - name: Trivy – configuración insegura (Dockerfile e IaC)
        run: |
          docker run --rm -v "$PWD:/src" \
            aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            config --severity HIGH,CRITICAL --exit-code 1 /src
      - name: Smoke test del contenedor
        run: |
          docker run -d --name app -p 3000:3000 sjl-seguro:${{ github.sha }}
          for _ in $(seq 1 20); do curl -fs http://localhost:3000/api/health && break; sleep 2; done
          curl -fs http://localhost:3000/api/health | grep '"estado":"ok"'
          curl -fsI http://localhost:3000/ | grep -i 'content-security-policy'
          docker rm -f app

  # ---------------------------------------------------------------- DEPLOY
  deploy:
    name: Deploy a producción (Render)
    runs-on: ubuntu-latest
    needs: [build-test, sast, sca, secretos, contenedor]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: produccion
      url: ${{ vars.RENDER_URL }}
    steps:
      - name: Disparar despliegue (Render Deploy Hook)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::Falta el secreto RENDER_DEPLOY_HOOK_URL"; exit 1; fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Despliegue solicitado a Render para el commit ${GITHUB_SHA::7}"
      - name: Esperar la nueva versión y verificar /api/health
        env:
          URL: ${{ vars.RENDER_URL }}
        run: |
          for i in $(seq 1 60); do
            commit=$(curl -fs "$URL/api/health" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "✅ Versión $GITHUB_SHA en línea en $URL"
              echo "### 🚀 Desplegado en [$URL]($URL) (commit \`${GITHUB_SHA::7}\`)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Esperando despliegue ($i/60)… versión actual: ${commit:-sin respuesta}"; sleep 15
          done
          echo "::error::La nueva versión no respondió a tiempo"; exit 1

  # ---------------------------------------------------------------- DAST
  dast:
    name: DAST – OWASP ZAP baseline
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Escaneo pasivo de la aplicación desplegada
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.RENDER_URL }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: reporte-zap
